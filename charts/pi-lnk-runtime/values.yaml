# 默认 values（dev 单节点，spec §5.2.1）
# 与 spec 的差异点（端口定案后更新，见 AGENTS.md 端口表）：
#   - 容器端口 8100（spec 写作时为 8080 旧值）
#   - dev 用 NodePort 暴露给 K8s 外的 Nest（本机 docker）；Traefik/servicelb 在 CVM 上禁用（内存约束）

replicaCount: 1

image:
  repository: 127.0.0.1:5000/pi-runtime
  tag: "0.0.2"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8100
  nodePort: 30100

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1.5Gi

pvc:
  size: 5Gi
  storageClassName: local-path

networkPolicy:
  enabled: true
  # NodePort 入口来源（dev：宿主机 docker 网段 + 节点网段；prod 收紧到 Nest 出口）
  # 172.16.0.0/12 覆盖 docker0(172.17) 及所有自定义 compose 网络（如 lnkpi-net 172.20）
  ingressCidrs:
    - 172.16.0.0/12
    - 10.0.0.0/8
  # egress 白名单：LLM provider（443）
  egressCidrs:
    - 0.0.0.0/0
  # 额外 egress（P1 工具转发：Pod → 宿主 Nest）。列表项：
  #   cidr: 目标网段；ports: TCP 端口列表
  egressExtra: []
  # ⚠️ docker 会把 pod 发往宿主已发布端口（如 :5100）的流量 DNAT 成
  # "容器IP:内部端口"（如 172.20.x.x:3001），且 DNAT 发生在 netpol 过滤之前，
  # 所以白名单必须放行 DNAT 后的真实目的地，而不是宿主 IP:发布端口
  # （实测放行 10.1.0.12/32:5100 仍会被 REJECT，ECONNREFUSED）。
  # 示例（dev 单节点，Nest 跑在 lnkpi-net compose 网络内）：
  # egressExtra:
  #   - cidr: 172.20.0.0/16   # lnkpi-net 子网（DNAT 后目的地）
  #     ports: [3001]         # Nest 容器内部端口
  #   - cidr: 10.1.0.12/32    # 宿主 NodeIP（留作直连场景）
  #     ports: [5100]

env:
  PORT: "8100"
  NODE_ENV: "production"
  PI_RUNTIME_DATA_DIR: "/data/sessions"
  # 仓库根 skills/ 随镜像落在 /app/skills（drop-in 目录，新增 skill 无需改代码）
  PI_RUNTIME_SKILLS_DIR: "/app/skills"
  # build_info 版本标签（与镜像 tag 对齐，部署时 --set 覆盖）
  PI_RUNTIME_VERSION: "0.0.1"
  # P0-① 持久会话（spec §5.6）：内存句柄 TTL + 磁盘会话保留 + 原生 compaction
  PI_RUNTIME_SESSION_TTL_MS: "1800000"
  PI_RUNTIME_SESSION_SWEEP_MS: "300000"
  PI_RUNTIME_SESSIONS_MAX_BYTES: "3221225472"
  PI_RUNTIME_SESSIONS_MAX_COUNT: "200"
  PI_RUNTIME_COMPACTION_ENABLED: "true"
  # 触发口径见 PI_RUNTIME_COMPACTION_TARGET_RATIO（runtime-deploy.yml --set-string）。
  # 刻意不设 RESERVE_TOKENS 默认：显式值会让 ratio 失效（旧口径优先），且
  # --reuse-values + --set null 删不掉 chart 默认值（0.0.29 实证残留）。
  PI_RUNTIME_COMPACTION_KEEP_RECENT_TOKENS: "20000"
  # F-01：压缩判定的上下文窗口覆盖值。
  #   agnes provider 把 contextWindow 声明为 1_000_000，使默认阈值 1_000_000-16_384
  #   = 983,616 永不触及 —— 留空即沿用模型声明值，也就是实际永不压缩。
  #   启用（数字型 env 一律 --set-string，禁用 --set，否则会被渲染成科学计数法）：
  #     --set-string env.PI_RUNTIME_COMPACTION_CONTEXT_WINDOW=128000
  PI_RUNTIME_COMPACTION_CONTEXT_WINDOW: ""
  # B-1 阻塞式确认工具（ask_user / propose_generation）的等待上限。
  #   代码缺省 300000（5min，2026-10-01 由 30min 下调：30min 在 UI 上就是「生成回复中」
  #   无限转圈，用户判定卡死）。超时不是失败——工具以带 status 的正常值交还，模型自主续行。
  #   ⚠️ 数字型 env 一律 --set-string，禁用 --set（科学计数法事故）。
  ASK_USER_TIMEOUT_MS: "300000"
  # 阻塞开关缺省即 true（代码默认），显式声明只为部署面可见可调；off = 退回非阻塞 v1 行为。
  ASK_USER_BLOCKING: "true"

# D-ζ' 双 runtime 开关（shadow/active 由部署侧控制，Day-1 默认 off）
piRuntimeMode: "off"

secrets:
  # 生产值由部署时 --set 或 -f secrets.yaml 注入，仓库不落明文
  # 注意：官方国内站 API 端点是 api.agnes-ai.cn（apihub.* 是老平台，部分账号 key 不通用）
  AGNES_API_KEY: "REPLACE_ME"
  AGNES_BASE_URL: "https://api.agnes-ai.cn/v1"
  AGNES_MODEL_ID: "agnes-2.5-flash"
  # P1 工具转发凭据（Nest AgentInternalGuard 校验 x-lnkpi-service-token）：
  #   NEST_SERVICE_TOKEN = Nest 侧 AGENT_RUNTIME_SERVICE_TOKEN 的值。
  #   两者都未设置时 pi-runtime 降级纯文本模式（tools=[]）。
  # 部署时：--set secrets.NEST_SERVICE_TOKEN=<值> \
  #         --set env.NEST_BASE_URL=http://<NodeIP>:5100/api   （必须带 /api 全局前缀）
  # TAVILY_API_KEY: web_search/web_fetch 检索源 key（https://tavily.com 免费申请，1000 次/月）
  #   未配置或为 REPLACE_ME 时 web 工具不注册（fail-closed 降级，spec §4）
  #   部署时：--set secrets.TAVILY_API_KEY=<值>
  TAVILY_API_KEY: "REPLACE_ME"

hpa:
  enabled: false
