apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pi-lnk-runtime.fullname" . }}-sessions
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pi-lnk-runtime.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.size }}
  {{- if .Values.pvc.storageClassName }}
  storageClassName: {{ .Values.pvc.storageClassName }}
  {{- end }}
