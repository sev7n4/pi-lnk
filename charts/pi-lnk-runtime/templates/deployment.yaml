apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pi-lnk-runtime.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pi-lnk-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pi-runtime
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pi-runtime
        {{- include "pi-lnk-runtime.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pi-lnk-runtime.serviceAccountName" . }}
      containers:
        - name: pi-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: rpc
              containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: PI_RUNTIME_MODE
              value: {{ .Values.piRuntimeMode | quote }}
            {{- range $key, $value := .Values.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "pi-lnk-runtime.fullname" $ }}-secrets
                  key: {{ $key }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: sessions
              mountPath: /data/sessions
          livenessProbe:
            httpGet:
              path: /healthz
              port: rpc
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: rpc
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: sessions
          persistentVolumeClaim:
            claimName: {{ include "pi-lnk-runtime.fullname" . }}-sessions
