name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-figures:
    name: Verify spec figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify spec figures (R1–R8)
        run: pnpm verify-spec-figures

      - name: Verify tool framework contract (pi-runtime ↔ vendored pi-agent-core)
        run: pnpm verify-tool-contract

      - name: Verify tool details contract（_signal 注入完备性 + 键名规范）
        run: pnpm verify:details

      - name: Verify tool tiering consistency (常驻集 ⇄ 资产点名)
        run: pnpm verify-tool-tiering

      - name: Verify AGENTS.md factual claims
        run: pnpm verify-claims

      - name: Verify markdown links (no broken relative links)
        run: pnpm verify-links

      - name: Verify web dist upload contract
        run: pnpm verify-web-upload

      - name: Verify agent rail contract gates
        run: pnpm verify-agent-rail-gates

      - name: Verify isMobileLayout scope (Shell-only ratchet)
        run: python3 scripts/verify-is-mobile-layout-scope.py

      - name: Verify phase4 delete scope (NO_DELETE_TARGET ratchet)
        run: python3 scripts/verify-phase4-delete-scope.py

      - name: Verify pc canvas legacy scope (NO_MERGE ratchet)
        run: python3 scripts/verify-pc-canvas-legacy-scope.py

      - name: Spec figures summary
        if: always()
        run: |
          echo "## Spec Figures Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rules: docs/superpowers/SPEC-CONVENTIONS.md §4 (R1–R8)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: documents dated on/after 2026-09-22 (use --all for a full sweep)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Also: \`pnpm verify-claims\` checks AGENTS.md factual claims (counts / section names / workflow names / pinned versions)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Also: \`pnpm verify-links\` checks markdown relative links in active docs (vendor / historical plans excluded by design)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @lnkpi/server exec prisma generate

      - name: Build packages
        run: pnpm build

      - name: Install XML validator (xmllint)
        # ⛔ 为什么必须有这一步：graph/visual.test.ts 的「SVG 必须能被 XML 解析器吃下」
        #   是唯一能兜住「无值属性」这类规范错误的判据（正则只认已知属性名）。
        #   ubuntu-latest 镜像不自带 xmllint ⇒ 2026-10-09 首次上 CI 时
        #   断言以 `spawnSync xmllint ENOENT` 失败，而 macOS 本地自带 xmllint 全绿。
        # ⛔ 为什么不再 apt：原 `apt-get install libxml2-utils` 每次新建 runner 都要
        #   联网现下 43.2 kB；2026-11-11 14:01Z 起托管 runner 出口 DNS 无法解析
        #   ubuntu 镜像源 ⇒ 13 次独立 runner 全卡在此步，pnpm test / docker build
        #   根本没执行（不是测试红，是判据没机会跑）。改为 runner 预装 python3 的
        #   离线 shim：xml.etree.ElementTree 做严格 well-formedness 检查，
        #   判据不削弱（本步双向自检：合法 SVG=0 / 无值属性坏 SVG≠0），
        #   并彻底移除 CI 对 apt 网络的单点依赖。绝不能 skip 成假绿。
        run: |
          set -euo pipefail
          command -v python3 >/dev/null || { echo "python3 missing"; exit 1; }
          SHIM_DIR="$RUNNER_TEMP/xml-shim"
          mkdir -p "$SHIM_DIR"
          cat > "$SHIM_DIR/xmllint" <<'PY'
          #!/usr/bin/env python3
          """Offline xmllint-compatible well-formedness gate (see ci.yml)."""
          import sys
          import xml.etree.ElementTree as ET

          args = sys.argv[1:]
          if "--version" in args:
              print("xmllint: using Python xml.etree.ElementTree (offline CI shim)")
              sys.exit(0)
          files = [a for a in args if not a.startswith("-")]
          if not files:
              print("usage: xmllint [--noout] FILE", file=sys.stderr)
              sys.exit(2)
          try:
              ET.parse(files[-1])
          except Exception as exc:
              print(f"{files[-1]}: {exc}", file=sys.stderr)
              sys.exit(1)
          sys.exit(0)
          PY
          chmod +x "$SHIM_DIR/xmllint"
          echo "$SHIM_DIR" >> "$GITHUB_PATH"
          export PATH="$SHIM_DIR:$PATH"
          xmllint --version
          printf '%s\n' '<svg xmlns="http://www.w3.org/2000/svg"><rect x="1" width="3" height="4"/></svg>' > "$SHIM_DIR/good.svg"
          printf '%s\n' '<svg xmlns="http://www.w3.org/2000/svg"><rect data-x/></svg>' > "$SHIM_DIR/bad.svg"
          xmllint --noout "$SHIM_DIR/good.svg" || { echo "SELF-CHECK: valid SVG must pass"; exit 1; }
          if xmllint --noout "$SHIM_DIR/bad.svg" 2>/dev/null; then
            echo "SELF-CHECK: malformed SVG must fail"
            exit 1
          fi
          echo "XML_GATE_SELF_CHECK=PASS"

      - name: Unit and integration tests
        run: pnpm test

      - name: Build summary
        if: always()
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node: 22" >> "$GITHUB_STEP_SUMMARY"
          echo "- pnpm build: completed" >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Build API Docker image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: false
          provenance: false
          sbom: false
          tags: lnkpi-api:ci
          cache-from: type=gha,scope=lnkpi-api
          cache-to: type=gha,scope=lnkpi-api,mode=max,ignore-error=true
