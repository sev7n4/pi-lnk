name: Prompt Lint

# 提示词注册中心门禁：判据与线上运行时共用 assertRegistryIntegrity（L0–L9）。
# 独立于 ci.yml —— ci.yml 的 push paths-ignore 里有 "**/*.md"，
# 只改 prompt-registry/*.md 的 push 不会触发它，而那正是最需要门禁的场景。
on:
  pull_request:
    paths:
      - "prompt-registry/**"
      - "apps/server/src/agent/pi-runtime/prompt-registry.*"
      - "scripts/prompt-lint.ts"
      - "package.json"
  push:
    branches: [master]
    paths:
      - "prompt-registry/**"
      - "apps/server/src/agent/pi-runtime/prompt-registry.*"
      - "scripts/prompt-lint.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prompt-lint:
    name: prompt-registry 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint prompt registry
        run: pnpm prompt:lint

      - name: Prompt lint summary
        if: always()
        run: |
          echo "## Prompt Registry Lint" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rules: docs/superpowers/specs/2026-10-02-w1a-prompt-registry-design.md §4.5 (L0–L9)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: prompt-registry/rules/*.md + MANIFEST.yaml + loader/fallback 一致性" >> "$GITHUB_STEP_SUMMARY"
