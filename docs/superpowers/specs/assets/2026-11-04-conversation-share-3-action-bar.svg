<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="240" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="899" height="239" fill="none" stroke="#E5E7EB"/>

  <!-- caption -->
  <text x="32" y="40" font-size="18" font-weight="600" fill="#1F2430">图 3 · 操作栏重绘视觉稿（assistant 回合固定四项）</text>
  <text x="32" y="64" font-size="12" fill="#6B7280">线宽 1.5 · currentColor · 有助于激活态填充品牌紫 --lnk-accent</text>

  <!-- four buttons -->
  <!-- 1. 有帮助 (active, filled) -->
  <g transform="translate(32,90)">
    <rect x="0" y="0" width="200" height="96" rx="12" fill="#7C5CFF" fill-opacity="0.12" stroke="#7C5CFF" stroke-width="1.5"/>
    <g transform="translate(20,18)" stroke="#7C5CFF" stroke-width="1.5" fill="#7C5CFF" fill-opacity="0.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 22 v-9 a4 4 0 0 0 -4 -4 h-6 a4 4 0 0 0 -4 4 v9" fill="none"/>
      <path d="M4 22 h22 v14 a4 4 0 0 1 -4 4 h-14 a4 4 0 0 1 -4 -4 z"/>
    </g>
    <text x="100" y="78" font-size="15" font-weight="600" fill="#7C5CFF" text-anchor="middle">有帮助</text>
    <text x="100" y="86" font-size="10" fill="#7C5CFF" text-anchor="middle" opacity="0.8">激活态·填充</text>
  </g>

  <!-- 2. 无帮助 (outline) -->
  <g transform="translate(248,90)">
    <rect x="0" y="0" width="200" height="96" rx="12" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
    <g transform="translate(20,18)" stroke="#6B7280" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2 v9 a4 4 0 0 1 4 4 h6 a4 4 0 0 1 4 -4 v-9"/>
      <path d="M4 2 h22 v-14 a4 4 0 0 0 -4 -4 h-14 a4 4 0 0 0 -4 4 z"/>
    </g>
    <text x="100" y="78" font-size="15" font-weight="500" fill="#6B7280" text-anchor="middle">无帮助</text>
    <text x="100" y="86" font-size="10" fill="#9CA3AF" text-anchor="middle">描边·无填充</text>
  </g>

  <!-- 3. 复制 -->
  <g transform="translate(464,90)">
    <rect x="0" y="0" width="200" height="96" rx="12" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
    <g transform="translate(20,18)" stroke="#374151" stroke-width="1.5" fill="none" stroke-linejoin="round">
      <rect x="6" y="6" width="20" height="24" rx="3"/>
      <rect x="0" y="0" width="20" height="24" rx="3" fill="#FFFFFF"/>
    </g>
    <text x="100" y="78" font-size="15" font-weight="500" fill="#374151" text-anchor="middle">复制</text>
    <text x="100" y="86" font-size="10" fill="#9CA3AF" text-anchor="middle">复制本轮文本</text>
  </g>

  <!-- 4. 分享 (accent) -->
  <g transform="translate(680,90)">
    <rect x="0" y="0" width="200" height="96" rx="12" fill="none" stroke="#7C5CFF" stroke-width="1.5"/>
    <g transform="translate(20,18)" stroke="#7C5CFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="6" r="2.5" fill="#7C5CFF" stroke="none"/>
      <circle cx="20" cy="12" r="2.5" fill="#7C5CFF" stroke="none"/>
      <circle cx="8" cy="22" r="2.5" fill="#7C5CFF" stroke="none"/>
      <path d="M10.5 7 L17.5 11 M10.5 21 L17.5 13"/>
      <path d="M20 12 L2 12"/>
    </g>
    <text x="100" y="78" font-size="15" font-weight="500" fill="#7C5CFF" text-anchor="middle">分享</text>
    <text x="100" y="86" font-size="10" fill="#7C5CFF" text-anchor="middle">唤起分享面板</text>
  </g>
</svg>
