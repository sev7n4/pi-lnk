<svg viewBox="0 0 580 780" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="580" height="780" fill="#ffffff"/>

  <!-- 手机屏 -->
  <rect x="20" y="20" width="380" height="740" rx="36" fill="#f2f2f7" stroke="#d1d1d6" stroke-width="1.5"/>

  <!-- 状态栏 -->
  <text x="48" y="52" font-size="12" font-weight="600" fill="#1c1c1e">9:41</text>
  <rect x="356" y="40" width="20" height="10" rx="3" fill="none" stroke="#1c1c1e" stroke-width="1.2"/>
  <rect x="358" y="42" width="12" height="6" rx="1.5" fill="#1c1c1e"/>

  <!-- ① 导航三段：取消 / 大标题 / 发送胶囊 -->
  <text x="44" y="92" font-size="15" fill="#007aff">取消</text>
  <text x="210" y="93" font-size="17" font-weight="700" fill="#1c1c1e" text-anchor="middle">改词</text>
  <rect x="300" y="70" width="80" height="30" rx="15" fill="#007aff"/>
  <path d="M314 88 L320 80 L326 88 M320 80 L320 93" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="352" y="90" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">发送</text>

  <!-- ② 产物上下文行 -->
  <rect x="36" y="118" width="348" height="58" rx="12" fill="#ffffff"/>
  <rect x="48" y="130" width="34" height="34" rx="9" fill="#e8f2ff"/>
  <rect x="55" y="139" width="15" height="12" rx="2.5" fill="none" stroke="#007aff" stroke-width="1.8"/>
  <path d="M70 143 L77 140 L77 150 L70 147 Z" fill="#007aff"/>
  <text x="94" y="144" font-size="13" font-weight="600" fill="#1c1c1e">城市夜景</text>
  <text x="94" y="161" font-size="11" fill="#8e8e93">视频 · 发送后 agent 将按新词重做并替换当前产物</text>

  <!-- ③ 提示词：无框输入 -->
  <text x="38" y="210" font-size="11" font-weight="600" letter-spacing="2" fill="#aeaeb2">提示词</text>
  <text x="38" y="232" font-size="14" fill="#1c1c1e">夜晚的城市街道，霓虹灯反光，电影感构图，</text>
  <text x="38" y="252" font-size="14" fill="#1c1c1e">浅景深，35mm 胶片质感</text>
  <rect x="240" y="241" width="2" height="15" fill="#007aff"/>

  <line x1="38" y1="278" x2="382" y2="278" stroke="#e5e5ea" stroke-width="1"/>

  <!-- ④ 参数 chips（可点 → 意见预填） -->
  <text x="38" y="304" font-size="11" font-weight="600" letter-spacing="2" fill="#aeaeb2">参数</text>
  <rect x="80" y="290" width="82" height="20" rx="7" fill="#ffffff"/>
  <text x="121" y="304" font-size="11" fill="#6e6e73" text-anchor="middle">flux-1.1-pro</text>
  <rect x="168" y="290" width="38" height="20" rx="7" fill="#ffffff"/>
  <text x="187" y="304" font-size="11" fill="#6e6e73" text-anchor="middle">16:9</text>
  <rect x="212" y="290" width="30" height="20" rx="7" fill="#ffffff"/>
  <text x="227" y="304" font-size="11" fill="#6e6e73" text-anchor="middle">2K</text>
  <text x="382" y="304" font-size="10" fill="#aeaeb2" text-anchor="end">由 agent 锁定</text>

  <text x="38" y="336" font-size="11" font-weight="600" letter-spacing="2" fill="#aeaeb2">引用</text>
  <rect x="80" y="322" width="92" height="20" rx="7" fill="#ffffff"/>
  <text x="126" y="336" font-size="11" fill="#6e6e73" text-anchor="middle">城市航拍.mp4</text>

  <line x1="38" y1="360" x2="382" y2="360" stroke="#e5e5ea" stroke-width="1"/>

  <!-- ⑤ 我的意见：无框输入 -->
  <text x="38" y="388" font-size="11" font-weight="600" letter-spacing="2" fill="#aeaeb2">我的意见</text>
  <text x="38" y="412" font-size="14" fill="#aeaeb2">想让 agent 怎么改？</text>
  <rect x="165" y="401" width="2" height="14" fill="#007aff" opacity="0.45"/>

  <!-- ⑥ at mm:ss 音频时刻预填（保留） -->
  <rect x="38" y="436" width="86" height="22" rx="11" fill="#e8f2ff"/>
  <circle cx="53" cy="447" r="6.5" fill="none" stroke="#007aff" stroke-width="1.8"/>
  <path d="M53 444 L53 447 L55.5 448.5" stroke="#007aff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="66" y="451" font-size="11" font-weight="600" fill="#007aff">at 00:23</text>

  <!-- home bar -->
  <rect x="140" y="742" width="140" height="4" rx="2" fill="#c7c7cc"/>

  <!-- 圈注 -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="392" cy="85" r="11" fill="#007aff"/><text x="392" y="89" fill="#ffffff">①</text>
    <circle cx="396" cy="147" r="11" fill="#007aff"/><text x="396" y="151" fill="#ffffff">②</text>
    <circle cx="396" cy="240" r="11" fill="#007aff"/><text x="396" y="244" fill="#ffffff">③</text>
    <circle cx="252" cy="300" r="11" fill="#007aff"/><text x="252" y="304" fill="#ffffff">④</text>
    <circle cx="396" cy="402" r="11" fill="#007aff"/><text x="396" y="406" fill="#ffffff">⑤</text>
    <circle cx="136" cy="447" r="11" fill="#007aff"/><text x="136" y="451" fill="#ffffff">⑥</text>
  </g>

  <!-- 右侧图例 -->
  <g font-size="12" fill="#1c1c1e">
    <text x="420" y="80" font-weight="700" fill="#007aff">图例</text>
    <text x="420" y="104">① 主出口右上「发送」胶囊</text>
    <text x="420" y="122">(aria-label=发给 agent 修改)</text>
    <text x="420" y="150">② 产物上下文行：</text>
    <text x="420" y="168">四类节点唯一差异化点</text>
    <text x="420" y="196">③ 提示词无框输入：</text>
    <text x="420" y="214">去 border，仅光标与文案</text>
    <text x="420" y="242">④ 参数 chip 可点：</text>
    <text x="420" y="260">翻译成意见预填（不改值）</text>
    <text x="420" y="288">⑤ 意见无框输入</text>
    <text x="420" y="316">⑥ at 00:23 音频时刻预填</text>
    <text x="420" y="334">（v1.5 Q 既有能力，保留）</text>
    <text x="420" y="380" fill="#6e6e73">底部通栏「发给 agent 修改」</text>
    <text x="420" y="398" fill="#6e6e73">大按钮退役（主出口上移）</text>
    <text x="420" y="426" fill="#6e6e73">z-85 全屏浮层保持不动</text>
    <text x="420" y="454" fill="#6e6e73">全部令牌走 --lnk-*</text>
  </g>
</svg>
