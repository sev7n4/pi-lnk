# Optional observability overlay — OTel Collector → Tempo (+ Grafana UI).
#
# Usage on CVM:
#   docker compose -f deploy/docker-compose.prod.yml \
#     -f deploy/docker-compose.observability.yml up -d
#
# ⚠️ 本 overlay 当前未在生产启用（K6 监控栈未部署）。原 agent-runtime 的 OTLP 接入
# 片段已随老 runtime 退役移除；将来接 pi-runtime 时在此补对应服务的 environment。
#
# Grafana UI (local only): http://127.0.0.1:3000 → Explore → Tempo

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: lnkpi-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    networks:
      - lnkpi
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: lnkpi-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - lnkpi-tempo-data:/var/tempo
    networks:
      - lnkpi

  grafana:
    image: grafana/grafana:11.3.0
    container_name: lnkpi-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - lnkpi
    depends_on:
      - tempo

volumes:
  lnkpi-tempo-data:
