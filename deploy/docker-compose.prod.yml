# 生产 compose — 独立网络，与 pintuotuo / aimarket 栈隔离
# 本地调试:
#   cp deploy/.env.production.example .env
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# 服务器（CVM 本地 build，推荐）:
#   export IMAGE_TAG=<git-sha> LNKPI_API_IMAGE=lnkpi-api:<git-sha>
#   docker compose -f deploy/docker-compose.prod.yml build api
#   docker compose -f deploy/docker-compose.prod.yml up -d --no-build api
# 服务器（TCR 镜像，备选）:
#   export IMAGE_TAG=<git-sha> TCR_REGISTRY=ccr.ccs.tencentyun.com TCR_NAMESPACE=lnkpi
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.prod.images.yml pull
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.prod.images.yml up -d --no-build

name: lnkpi

services:
  api:
    image: ${LNKPI_API_IMAGE:-lnkpi-api:local}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
      args:
        USE_TENCENT_APT_MIRROR: ${USE_TENCENT_APT_MIRROR:-0}
    container_name: lnkpi-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "3001"
      DATABASE_URL: file:/app/apps/server/data/lnkpi.db
      MATTING_SERVICE_URL: ${MATTING_SERVICE_URL:-http://lnkpi-matting:8000}
      LNKPI_SEGMENT_SERVICE_URL: ${LNKPI_SEGMENT_SERVICE_URL:-http://lnkpi-segment:8000}
    ports:
      - "0.0.0.0:5100:3001"
    volumes:
      - lnkpi-data:/app/apps/server/data
      - lnkpi-uploads:/app/apps/server/uploads
    networks:
      - lnkpi
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # pi-runtime 由 K3s 独立部署（NodePort 30100），经 PI_RUNTIME_URL 指向；
    # 详见 docs/ops/RUNBOOK-pi-runtime-deploy.md

  # 仅内网；勿映射端口到公网。模型预置在镜像层（isnet-general-use，~170MB）
  matting:
    image: ${LNKPI_MATTING_IMAGE:-lnkpi-matting:local}
    build:
      context: ./docker/matting
    container_name: lnkpi-matting
    restart: unless-stopped
    mem_limit: 1g
    # 无 ports：只通过 lnkpi-net 被 api 访问
    networks:
      - lnkpi
    volumes:
      - matting-models:/root/.u2net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # matting-models named volume 为空卷时会遮蔽镜像层预置模型（/root/.u2net），
      # 首启需同步/下载模型（~170MB）才能通过 health，放宽 start_period 防反复重启。
      start_period: 180s

  # 仅内网；勿映射端口到公网。MobileSAM ONNX 预置在镜像层（~45MB），点提示分割。
  # mem_limit 700m：onnxruntime CPU 推理 + 4 条 embedding 缓存，试用期不扩内存的前提下可运行。
  segment:
    image: ${LNKPI_SEGMENT_IMAGE:-lnkpi-segment:local}
    build:
      context: ./docker/segment
    container_name: lnkpi-segment
    restart: unless-stopped
    mem_limit: 700m
    # 无 ports：只通过 lnkpi-net 被 api 访问
    networks:
      - lnkpi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  lnkpi:
    name: lnkpi-net

volumes:
  lnkpi-data:
  lnkpi-uploads:
  matting-models:
