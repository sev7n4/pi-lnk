# lnkpi 前端 + API 反代（CVM nginx）
# 占位符 __WEB_PORT__ / __API_PORT__ 由 deploy/deploy-web.sh 替换
#
# 手动部署:
#   1. cd repo && pnpm --filter @lnkpi/web build   # VITE_API_BASE_URL=/api
#   2. rsync -avz apps/web/dist/ root@<CVM>:/opt/lnkpi/web/dist/
#   3. ssh root@<CVM> 'bash /opt/lnkpi/deploy/deploy-web.sh'

server {
    # HTTP/2（2026-10-24 性能修复）：
    # 改造前是纯 HTTP/1.1 ⇒ 画布页的 19 个静态依赖分包 = 19 次独立往返，
    # 每包都有 TCP 建连 + 队头等待开销。生产实测服务器出网仅 ~290-410 KB/s
    # 且方差 2.5 倍 ⇒ 往返次数直接决定首屏白屏时长。
    # nginx 1.26.3 编译时带 --with-http_v2_module ⇒ 开 HTTP/2 零成本、零新增资源。
    # ⚠️ 与 /api/ 的 SSE 长流无冲突：SSE 走 proxy_buffering off，HTTP/2 下仍逐帧推送。
    listen __WEB_PORT__ http2;
    server_name _;

    root /opt/lnkpi/web/dist;
    index index.html;

    gzip on;
    # ⚠️ 补齐类型（2026-10-24）：原来缺 image/svg+xml / font/* / application/wasm 等。
    #    缺 image/svg+xml 的后果最直接——品牌页的墨鱼 logo（SVG）与 favicon
    #    以未压缩原样传输。text/* + application/javascript 已覆盖 JS/CSS。
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml font/woff font/woff2 application/wasm;
    gzip_min_length 1000;
    # 压缩等级 6（nginx 默认 1）：等级 1 几乎不压缩，纯浪费 CPU。
    # 静态资源是不可变文件（immutable），压一次存一次 ⇒ 等级 6 收益更大。
    gzip_comp_level 6;
    # ⚠️ 刻意**不开** gzip_static：它要求磁盘上预先存在 .gz 文件，
    #    而本仓的部署流程（deploy-web.sh）没有预压缩环节 ⇒ 开了也只是空转。
    #    真要开，需要先在构建产物上跑一遍 gzip 生成 .gz 旁文件。

    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:__API_PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
