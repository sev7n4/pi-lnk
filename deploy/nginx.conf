# lnkpi 前端 + API 反代（CVM nginx）
# 占位符 __WEB_PORT__ / __API_PORT__ 由 deploy/deploy-web.sh 替换
#
# 手动部署:
#   1. cd repo && pnpm --filter @lnkpi/web build   # VITE_API_BASE_URL=/api
#   2. rsync -avz apps/web/dist/ root@<CVM>:/opt/lnkpi/web/dist/
#   3. ssh root@<CVM> 'bash /opt/lnkpi/deploy/deploy-web.sh'

server {
    listen __WEB_PORT__;
    server_name _;

    root /opt/lnkpi/web/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ⚠️ 必须是 `^~ /api/`（不是普通前缀 `location /api/`）：
    #    nginx 的 location 优先级是「精确(=) > 前缀(^~) > 正则(~) > 普通前缀」。
    #    若写成普通前缀，下面的**正则媒体 location** 会抢走
    #    `/api/uploads/<id>/avatar.jpg` 这类**由后端动态返回的图片** ⇒ try_files 找不到磁盘文件 ⇒ 404
    #    ⇒ 头像全挂。（2026-10-24 加正则媒体规则时同步修正）
    location ^~ /api/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:__API_PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # ⚠️ 媒体/静态文件：不存在的必须返回 404，**不能走 SPA 兜底**（2026-10-24 修复）。
    #
    # 事故：作品记录里的视频 URL 指向外部域（已 403 失效），
    # 另有相对路径的 mp4 在服务器上不存在 ⇒ 落到 `location /` 的 try_files
    # ⇒ 返回 **index.html（200，但 Content-Type 是 text/html）**
    # ⇒ 浏览器拿 HTML 当视频 ⇒ Chrome 报 **ERR_BLOCKED_BY_ORB**
    #   （Opaque Response Blocking：响应类型与 `<video>` 预期不符即阻止）
    # ⇒ Network 面板一片红，用户以为「页面坏了」。
    #
    # ✅ 这里先于 `location /` 匹配（nginx 正则 location 优先于前缀 location），
    #    `try_files $uri =404` ⇒ 不存在的媒体**明确 404** ⇒ 浏览器静默失败，无 ORB 噪音。
    #    存在的媒体仍正常返回，且同样长缓存。
    location ~* \.(mp4|webm|ogg|ogv|mov|m4v|jpg|jpeg|png|gif|svg|webp|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ⚠️ HTML 必须**每次校验**（2026-10-24 事故修复）：
    #    /assets/ 带 hash 可以 expires 1y，但 index.html **不能缓存** ——
    #    没有 Cache-Control 时浏览器走**启发式缓存**（Last-Modified 的 10%），
    #    实测拿到的是几小时前的旧 html。
    #    ⇒ 旧 html 引用旧入口 JS ⇒ 旧入口引用的 chunk 已随部署被删除 ⇒ **404 ⇒ 页面卡死**。
    #    （真机事故：品牌页点创作后「正在进入画布…」不动，Network 里
    #      `CanvasPage-DzJzzXU.js` 404，而当前版本是 `CanvasPage-CekCyTlu.js`）
    # ✅ no-cache（不是 no-store）：仍用 ETag 协商缓存，304 几乎零成本，
    #    但保证不会拿到旧版本。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
